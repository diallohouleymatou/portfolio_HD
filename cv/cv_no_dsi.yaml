    Profil:
      - >-
        Consultant technique et data intervenant depuis 2019 sur des sujets
        de digitalisation, Odoo, reporting, cadrage fonctionnel et
        accompagnement utilisateur.

    Compétences clés:
      - label: Stratégie SI & gouvernance
        details: digitalisation métier, cadrage fonctionnel, documentation, reporting, conduite du changement
      - label: Applications & ERP
        details: Odoo 18, CRM, achats, ventes, stock, comptabilité, workflows métier
      - label: Data, reporting & IA
