    Expérience:
      - company: G&G Professional Services
        position: Consultant Technique & Data
        location: Dakar, Sénégal
        start_date: 2025-07
        end_date: 2026-06
        highlights:
          - >-
            Pilote des missions de digitalisation et d'évolution de systèmes
            métiers pour plusieurs clients, avec un rôle combinant cadrage,
            coordination, reporting et exécution technique.
          - >-
            A mené pour EBS des développements critiques couvrant logistique,
            achats, ventes, comptabilité, CRM, site web et SAV mobile dans un
            contexte de 6 dépôts et 30 routes.
          - >-
            A conduit des migrations Odoo vers la version 18 sur des
            environnements métiers complexes, avec préservation des données et
            accompagnement utilisateur.
          - >-
            A formé environ 100 utilisateurs sur logistique, achats, stock et
            qualité de donnée, afin d'améliorer l'adoption et la fiabilité
            opérationnelle.

      - company: LIC
        position: Consultant produit, data & solutions
        location: Dakar, Sénégal / Remote
        start_date: 2025-08
        end_date: present
        highlights:
          - >-
            Intervient sur le cadrage produit, l'analyse métier, la
            documentation et l'alignement technico-commercial de produits
            e-commerce et de gestion.
          - >-
            Contribue à structurer besoins, KPI et supports de décision pour
            rapprocher attentes métier et capacité de livraison.

      - company: Teksi
        position: Développeur full-stack freelance
        location: Montréal, Canada / Remote
        start_date: 2025-04
        end_date: 2026-04
        highlights:
          - >-
            A développé un Student Management Service avec Spring Boot,
            Angular, Docker et DigitalOcean sur une architecture multi-tenant.

    Projets stratégiques sélectionnés:
      - >-
        **EBS - Digitalisation Odoo opérations** : développements sur
        logistique, achats, ventes, comptabilité, CRM, site web et SAV mobile
        dans un périmètre de 6 dépôts et 30 routes.
      - >-
        **CDA - Migration Odoo v8 vers v18** : continuité des données depuis
        2016 et alignement du socle applicatif sur les besoins métiers.
      - >-
        **Sentech - Migration Odoo v14 vers v18** : modernisation ERP,
        accompagnement utilisateur et dashboard financier.

    Formation & certifications:
      - >-
        **Master en Intelligence Artificielle** - Dakar Institute of
        Technology (en cours)
      - >-
        **Licence en Génie Logiciel** - Institut Supérieur d'Informatique
      - >-
        **DataCamp** - AI Engineer for Developers Associate ; **Google/Coursera** - Google AI Professional Certificate ; **Linux Foundation (LFD114)** - Porting Software to RISC-V

    Technologies:
      - label: Stack
        details: Spring Boot, Angular, API design, Odoo 18, SQL, Pandas, PostgreSQL, Docker, Microsoft 365, Azure, Linux

    Langues:
      - label: Langues
        details: Français, anglais, wolof, pulaar ; arabe, espagnol

