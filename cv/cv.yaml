            Intervient en parallèle sur cadrage produit, analyse métier,
            documentation et articulation technico-commerciale.

      - company: G&G Professional Services
        position: Consultant Technique & Data
        location: Dakar, Sénégal
        start_date: 2025-07
        end_date: 2026-06
        highlights:
          - >-
            A piloté des missions de digitalisation et d'évolution de systèmes
            métiers, en combinant cadrage, reporting, coordination et
            exécution technique.
          - >-
            A mené pour EBS des développements critiques sur logistique,
            achats, ventes, comptabilité, CRM, site web et SAV mobile dans un
            contexte de 6 dépôts et 30 routes.
          - >-
            A conduit des migrations Odoo v18 et formé environ 100
            utilisateurs sur logistique, achats, stock et qualité de donnée.

      - company: Teksi
        position: Développeur full-stack freelance
        location: Montréal, Canada / Remote
        start_date: 2025-04
        end_date: 2026-04
        highlights:
          - >-
            A développé un Student Management Service avec Spring Boot,
            Angular, Docker et DigitalOcean sur une architecture multi-tenant.

