          - >-
            Définit le socle Microsoft 365 + Odoo pour centraliser processus
            métier, collaboration, gestion documentaire et reporting.
          - >-
            Cadre une feuille de route de 6 mois centrée sur traçabilité,
            contrôles d'accès, sauvegarde et conduite du changement.

      - company: LIC
